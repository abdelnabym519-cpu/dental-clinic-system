# DenToRa AI platform — Phase 19A (Liodon PoC).
#
#   docker compose -f ai-compose.yml up -d
#
# Brings up the AI Orchestrator (FastAPI, :8000) and the Liodon engine
# (FastAPI + ONNX Runtime CPU, :8001) on the shared `dentora-network` created
# by docker-compose.dev.yml, so they reach MinIO (http://minio:9000) and
# MySQL (http://mysql:3306) by service name — no extra published ports, no
# changes to the core stack.
#
# Start the core stack first:
#   docker compose -f docker-compose.dev.yml up -d
#
# Credentials and endpoints come from the existing project environment
# (.env), the same variables the Next.js storage driver uses:
#   S3_ACCESS_KEY, S3_SECRET_KEY, S3_BUCKET, S3_REGION,
#   S3_FORCE_PATH_STYLE
# (DATABASE_URL and S3_ENDPOINT are NOT inherited: both are host-facing in
#  .env — localhost ports for the published MinIO/MySQL. The ai-orchestrator
#  environment block derives container-side values instead, overridable via
#  AI_MYSQL_* / AI_S3_ENDPOINT.)
# plus the Phase 19A additions:
#   AI_ORCHESTRATOR_URL, ORCHESTRATOR_SECRET
#
# The Liodon model is NOT baked into the image and NOT committed to git —
# it is the publisher's CC-BY-NC-4.0 artifact, verified by SHA-256 on the
# machine that runs it (see ai-validation/liodon/model/README.md). The
# read-only mount below points at that verified file; the engine refuses to
# start if the checksum does not match the registry.
#
# Development ports 8000/8001 are published for local validation only; this
# is not a production security configuration (see docs/INFRASTRUCTURE.md).

name: dentora-ai

services:
  ai-orchestrator:
    build:
      context: ./ai/orchestrator
      dockerfile: Dockerfile
    container_name: dentora-ai-orchestrator
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      # Engine routing
      LIODON_ENGINE_URL: http://liodon-engine:8001
      # Object storage — same variables the Next.js S3 storage driver uses.
      # S3_ENDPOINT is derived container-side (as DATABASE_URL below): the
      # .env value is HOST-facing (http://localhost:9000 — the published port)
      # so inheriting it would point the container at itself. Inside
      # dentora-network the MinIO service resolves by its service name `minio`
      # (docker-compose.dev.yml); override with AI_S3_ENDPOINT only if the
      # core stack changes.
      S3_ENDPOINT: ${AI_S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dentalerp}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dentalerp123}
      S3_BUCKET: ${S3_BUCKET:-dental-erp-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # Job state + audit trail live in the core application database.
      # .env's DATABASE_URL is HOST-facing (mysql://...@localhost:3306/... —
      # the published port) so the Next.js app on the host can connect, per
      # .env.example / scripts/dev-start.ts. Inside dentora-network the same
      # database is reached by the `mysql` service name, so the container URL
      # is derived here instead of inheriting the host one. Defaults mirror
      # docker-compose.dev.yml exactly (root / MYSQL_ROOT_PASSWORD /
      # MYSQL_DATABASE); override with AI_MYSQL_* only if you change the core
      # stack (e.g. non-default port '3307:3306').
      DATABASE_URL: "mysql://${AI_MYSQL_USER:-root}:${AI_MYSQL_PASSWORD:-dental}@mysql:${AI_MYSQL_PORT:-3306}/${AI_MYSQL_DATABASE:-dental_erp}"
      # Phase 19B engine routing (ADD — the 19A liodon line is unchanged):
      # the orchestrator dials each engine by this name inside
      # dentora-network.
      MESHSEGNET_MAX_ENGINE_URL: http://meshsegnet-max-engine:8002
      MESHSEGNET_MAN_ENGINE_URL: http://meshsegnet-man-engine:8003
      # Internal auth shared with Next.js. Required — the orchestrator
      # refuses to start without it (no silent fallback to a default).
      ORCHESTRATOR_SECRET: ${ORCHESTRATOR_SECRET:?ORCHESTRATOR_SECRET must be set in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - dentora-network
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://localhost:8000/health", timeout=3).status == 200 else 1)']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      liodon-engine:
        condition: service_healthy
      meshsegnet-max-engine:
        condition: service_healthy
      meshsegnet-man-engine:
        condition: service_healthy

  liodon-engine:
    build:
      context: ./ai/engines/liodon
      dockerfile: Dockerfile
    container_name: dentora-liodon-engine
    restart: unless-stopped
    ports:
      - '8001:8001'
    environment:
      # Resolved from the read-only mount below. The engine verifies the
      # SHA-256 against the model registry before loading and refuses to
      # start on mismatch (ai-validation/liodon/MODEL_PROVENANCE.md).
      MODEL_PATH: /app/models/liodon/best.onnx
      DEVICE: cpu
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # The validated artifact, exactly as verified on this machine:
    #   ai-validation/liodon/model/best.onnx
    #   SHA-256 4cee38b54203634d895ed30a8910f5d7c4cefe22b18f9116b5561d9dd6e83a71
    # Read-only: the service never writes to the model.
    volumes:
      - ./ai-validation/liodon/model:/app/models/liodon:ro
    networks:
      - dentora-network
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://localhost:8001/health", timeout=3).status == 200 else 1)']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------
  # Phase 19B (Engine 1) — MeshSegNet 3D dental surface segmentation.
  #
  # Same provenance contract as Liodon: the model is NOT baked into the
  # image and NOT committed to git — it is the official Tai-Hsien/MeshSegNet
  # artifact, verified by SHA-256 on the machine that runs it (see
  # ai-validation/meshsegnet/model/README.md). The read-only mount points
  # at the verified file; the engine refuses to start if the checksum does
  # not match the registry. MIT licensed.
  #
  #   max = maxilla (upper jaw)  — port 8002
  #   man = mandible (lower jaw) — port 8003
  # ---------------------------------------------------------------------
  meshsegnet-max-engine:
    build:
      context: ./ai/engines/meshsegnet-max
      dockerfile: Dockerfile
    container_name: dentora-meshsegnet-max-engine
    restart: unless-stopped
    ports:
      - '8002:8002'
    environment:
      # Resolved from the read-only mount below. The engine verifies the
      # SHA-256 against the model registry before loading and refuses to
      # start on mismatch (ai-validation/meshsegnet/MODEL_PROVENANCE.md).
      MODEL_PATH: /app/models/MeshSegNet_Max_15_classes_72samples_lr1e-2_best.zip
      DEVICE: cpu
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # The validated artifact, exactly as verified in the validation lab:
    #   ai-validation/meshsegnet/model/MeshSegNet_Max_15_classes_72samples_lr1e-2_best.zip
    #   SHA-256 727cd3c52fc85c55271782b5d432d2cc8199ec2445cfb39570249e3ea99675d
    volumes:
      - ./ai-validation/meshsegnet/model:/app/models:ro
    networks:
      - dentora-network
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://localhost:8002/health", timeout=3).status == 200 else 1)']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s    # torch model loading + module import takes longer

  meshsegnet-man-engine:
    build:
      context: ./ai/engines/meshsegnet-man
      dockerfile: Dockerfile
    container_name: dentora-meshsegnet-man-engine
    restart: unless-stopped
    ports:
      - '8003:8003'
    environment:
      MODEL_PATH: /app/models/MeshSegNet_Man_15_classes_72samples_lr1e-2_best.zip
      DEVICE: cpu
      LOG_LEVEL: ${LOG_LEVEL:-info}
    #   ai-validation/meshsegnet/model/MeshSegNet_Man_15_classes_72samples_lr1e-2_best.zip
    #   SHA-256 d74c87e0c1cbc47fcedcc6f8574c1ad484dd2e21a98cabfb3465a42a2760a0cf
    volumes:
      - ./ai-validation/meshsegnet/model:/app/models:ro
    networks:
      - dentora-network
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://localhost:8003/health", timeout=3).status == 200 else 1)']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

networks:
  dentora-network:
    external: true
    name: dentora-network
